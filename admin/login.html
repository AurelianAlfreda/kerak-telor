<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Kerak Telor</title>
    <link rel="icon" type="image/jpeg" href="../images/logo.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body d-flex align-items-center justify-content-center vh-100">
    <form id="form-login" class="card shadow border-0 p-4" style="width: 340px;">
        <img src="../images/logo.jpeg" alt="Logo Kerak Telor" class="admin-logo">
        <h1 class="fs-4 fw-bold text-center mb-4 login-title">Admin Kerak Telor</h1>

        <div id="login-error" class="alert alert-danger py-2 d-none"></div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" id="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-kt w-100 fw-bold">Masuk</button>
    </form>

    <script src="login.js"></script>
</body>
</html>
