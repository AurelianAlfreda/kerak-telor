<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pengguna - Kerak Telor</title>

    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="admin/style.css">
</head>

<body class="login-body d-flex align-items-center justify-content-center min-vh-100 p-3">
    <form id="form-login-user" class="card shadow border-0 p-4" style="width: 340px; max-width: 100%;" >
        <img src="images/logo.jpeg" alt="Logo Kerak Telor" class="admin-logo">

        <h1 class="fs-4 fw-bold text-center mb-4 login-title"> Hi! Selamat Datang </h1>

        <div id="login-error" class="alert alert-danger py-2 d-none" role="alert"></div>

        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" id="username" class="form-control" autocomplete="username" required autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" id="password" class="form-control" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-kt w-100 fw-bold">Masuk</button>
    </form>

    <script src="loginuser.js"></script>
</body>
</html>
